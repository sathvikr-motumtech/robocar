# Builds the Hugo site in website/ and uploads it to motumtech.in (Hostinger) over SSH (rsync).
#
# - Every push to main that touches website/ publishes the site.
# - "Run workflow" on the Actions tab republishes by hand.
# - Kill switch: set the repo variable PRODUCTION_LIVE to anything other than "true" to pause
#   all deploys (e.g. while restoring a backup on the server).
#
# Repo secrets:   DEPLOY_SSH_KEY (private key), SSH_KNOWN_HOSTS (server host key lines)
# Repo variables: SSH_HOST, SSH_PORT, SSH_USER, PRODUCTION_PATH, PRODUCTION_LIVE

name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-website.yml", ".gitmodules"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.1
  HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check deploys are enabled
        working-directory: .
        run: |
          if [ "${{ vars.PRODUCTION_LIVE }}" != "true" ]; then
            echo "Deploys are paused: repo variable PRODUCTION_LIVE is not 'true'."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo ${{ env.HUGO_VERSION }} (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          f=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "${HUGO_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" hugo && sudo mv hugo /usr/local/bin/ && hugo version

      - name: Refuse to publish images with metadata (GPS etc.)
        run: python3 scripts/strip_image_metadata.py --check

      - name: Build
        run: |
          hugo --gc --minify --environment production --baseURL https://motumtech.in/
          test -f public/index.html && test -f public/.htaccess

      - name: Upload to Hostinger
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.SSH_HOST }}
          PORT: ${{ vars.SSH_PORT }}
          USER: ${{ vars.SSH_USER }}
          DEST: ${{ vars.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          # Safety: never rsync --delete into an unexpected place (or an unset variable).
          for v in DEST HOST USER PORT; do [ -n "${!v}" ] || { echo "Refusing to deploy: $v is not set"; exit 1; }; done
          case "$DEST" in
            */public_html|*/public_html/) ;;
            *) echo "Refusing to deploy: destination '$DEST' is not a public_html folder"; exit 1 ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlcvz --delete \
            --exclude '.well-known/' \
            -e "ssh -p $PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            public/ "$USER@$HOST:${DEST%/}/"
          rm -f ~/.ssh/deploy_key
